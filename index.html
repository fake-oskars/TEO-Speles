    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        background-color: #f9fafb;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        zoom: 1;
        -moz-transform: scale(1);
        -webkit-transform: scale(1);
        transform: scale(1);
        -webkit-user-zoom: fixed;
        -webkit-text-size-adjust: none;
        -moz-text-size-adjust: none;
        -ms-text-size-adjust: none;
        text-size-adjust: none;
        font-family: 'Fredoka', ui-rounded, system-ui, sans-serif;
      }
      
      /* Prevent zoom on desktop */
      * {
        -webkit-user-zoom: fixed;
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        text-size-adjust: 100%;
        font-family: 'Fredoka', ui-rounded, system-ui, sans-serif;
      }
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }
      .animate-shake {
        animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
      }

      /* --- Shared playful animations --- */
      @keyframes screenIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
      .screen-in { animation: screenIn 0.35s ease-out both; }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.3) rotate(-8deg); }
        60% { opacity: 1; transform: scale(1.12) rotate(3deg); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
      }
      .pop-in { animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1) both; }
      @keyframes popOut { to { opacity: 0; transform: scale(1.5); } }
      .pop-out { animation: popOut 0.25s ease-in both; }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0) scale(1); }
        20% { transform: rotate(-10deg) scale(1.08); }
        40% { transform: rotate(9deg) scale(1.08); }
        60% { transform: rotate(-6deg) scale(1.05); }
        80% { transform: rotate(4deg) scale(1.02); }
      }
      .wiggle { animation: wiggle 0.9s ease-in-out both; }
      .wiggle-loop { animation: wiggle 1.2s ease-in-out infinite; }
      @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .floaty { animation: floaty 3s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
      .bob { animation: bob 1.6s ease-in-out infinite; }
      @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
      .drift { animation: drift linear infinite; }
      @keyframes burst {
        0% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
        100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(0.6); }
      }
      .burst-piece { animation: burst 0.9s cubic-bezier(.15,.7,.35,1) forwards; }
      @keyframes rain {
        0% { transform: translateY(-10vh) rotate(0); }
        100% { transform: translateY(110vh) rotate(var(--r)); }
      }
      .rain-piece { animation: rain linear forwards; }
      @keyframes tapHint {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(6px, 10px) scale(0.9); }
      }
      .tap-hint { animation: tapHint 1s ease-in-out infinite; }
      @keyframes starIn {
        0% { transform: scale(0) rotate(-180deg); }
        70% { transform: scale(1.4) rotate(10deg); }
        100% { transform: scale(1) rotate(0); }
      }
      .star-in { animation: starIn 0.6s cubic-bezier(.34,1.56,.64,1) both; }
      @keyframes roadDash { from { background-position-x: 0; } to { background-position-x: -40px; } }
      .road-dash { animation: roadDash 0.5s linear infinite; }

      /* Menu card illustrations */
      @keyframes jumpArc {
        0%   { left: 2%;  bottom: 78%; transform: scaleX(-1) rotate(-40deg); opacity: 1; }
        10%  { left: 8%;  bottom: 50%; transform: scaleX(-1) rotate(-20deg); }
        20%  { left: 20%; bottom: 22%; transform: scaleX(-1) rotate(-5deg); }
        30%  { left: 32%; bottom: 14%; transform: scaleX(-1) rotate(5deg); }
        40%  { left: 48%; bottom: 25%; transform: scaleX(-1) rotate(-20deg); }
        48%  { left: 58%; bottom: 52%; transform: scaleX(-1) rotate(-30deg); }
        58%  { left: 68%; bottom: 72%; transform: scaleX(-1) rotate(-10deg); }
        70%  { left: 76%; bottom: 65%; transform: scaleX(-1) rotate(10deg); }
        82%  { left: 80%; bottom: 38%; transform: scaleX(-1) rotate(25deg); }
        90%  { left: 82%; bottom: 22%; transform: scaleX(-1) rotate(10deg); opacity: 0.7; }
        95%  { opacity: 0; left: 82%; bottom: 22%; }
        100% { left: 2%;  bottom: 78%; transform: scaleX(-1) rotate(-40deg); opacity: 1; }
      }
      .vroom-jump-car { animation: jumpArc 3.5s ease-in-out infinite; }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(var(--orbit, 32px)) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(var(--orbit, 32px)) rotate(-360deg); }
      }
      .orbit-animation { animation: orbit 5s linear infinite; }
      @keyframes fadeInScale {
        0% { opacity: 0; transform: scale(0.6) rotate(-10deg); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
      }
      @keyframes cruise {
        0% { transform: translateX(-12%) scaleX(-1) translateY(0); }
        25% { transform: translateX(8%) scaleX(-1) translateY(-3px); }
        50% { transform: translateX(22%) scaleX(-1) translateY(0); }
        75% { transform: translateX(8%) scaleX(-1) translateY(-3px); }
        100% { transform: translateX(-12%) scaleX(-1) translateY(0); }
      }
      .cruise { animation: cruise 4s ease-in-out infinite; }

      .toy-btn {
        box-shadow: 0 8px 0 rgba(0,0,0,0.18), 0 14px 28px rgba(0,0,0,0.18), inset 0 2px 0 rgba(255,255,255,0.45);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .toy-btn:active {
        transform: translateY(6px) scale(0.98);
        box-shadow: 0 2px 0 rgba(0,0,0,0.18), 0 6px 12px rgba(0,0,0,0.15), inset 0 2px 0 rgba(255,255,255,0.45);
      }
      .text-outline { -webkit-text-stroke: 0; text-shadow: 0 3px 0 rgba(0,0,0,0.15), 0 6px 18px rgba(0,0,0,0.12); }
      @media (prefers-reduced-motion: reduce) {
        .drift, .floaty, .bob, .wiggle-loop, .cruise, .vroom-jump-car, .orbit-animation, .road-dash { animation: none !important; }
      }
    </style>
  </head>

    <noscript>
      <h1>Teo spēles — izglītojošas spēles bērniem no 2 līdz 5 gadiem</h1>
      <p>Tēva un dēla radītas spēles: tētis būvē, Teo izmēģina — tagad spēlēt var ikviens. Bezmaksas, bez reklāmām un reģistrācijas, latviski un vēl 6 valodās.</p>
      <ul>
        <li><b>Kas?</b> — bērns nosauc attēlu, spēle pasaka pareizo vārdu.</li>
        <li><b>Kur?</b> — atrodi pareizo attēlu starp citiem.</li>
        <li><b>Brrūm!</b> — trases, nāves cilpas, lēcieni un gāšana.</li>
        <li><b>Braucam!</b> — mierīga braukšana: luksofors, dzīvnieki, gardumi.</li>
        <li><b>Krāsosim!</b> — krāsošana, kurā dzird krāsu nosaukumus.</li>
      </ul>
      <p>Lai spēlētu, ieslēdziet JavaScript.</p>
    </noscript>

    <script>
      // Prevent zoom gestures
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      });
      
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      });
      
      // Prevent wheel zoom
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
      }, { passive: false });
      
      // Prevent keyboard zoom
      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
          e.preventDefault();
        }
      });
      
      // Prevent touch zoom
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
      
      // Prevent context menu
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
    </script>
