<style>
  :root { --bg: #f8fafc; --card: #fff; --ink: #0f172a; --dim: #64748b; }

  h1 { margin: 0 0 4px; } h2 { margin: 36px 0 12px; } p { color: var(--dim); margin: 0 0 16px; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); }

  figure { margin: 0; background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  figure img { width: 100%; display: block; }
  figcaption { padding: 10px 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  figcaption a { color: #2563eb; font-weight: 500; text-decoration: none; margin-left: 10px; }
  .story { max-width: 360px; }
</style>
